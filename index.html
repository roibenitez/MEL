<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brújula Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: una herramienta de trabajo en etapas. Barra de etapas arriba; en "Tablero", catálogo a la izquierda y la escalera de resultados (insumo → impacto) a la derecha. */
:root{
  --paper:#F2F4F6; --surface:#FFFFFF; --ink:#152033; --muted:#5A6577; --line:#D7DDE5;
  --accent:#2340C4; --accent-soft:#E3E8FA; --accent-ink:#FFFFFF;
  --good:#1D7A52; --good-soft:#E1F2EA; --bad:#B93C28; --bad-soft:#FBE7E3; --warn:#9A6514; --warn-soft:#FBF0DC;
  --l-impacto:#2340C4; --l-resultado:#4A62D4; --l-producto:#8496E2; --l-insumo:#B8C3EE;
  --shadow:0 1px 2px rgba(21,32,51,.06),0 4px 14px rgba(21,32,51,.05);
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0E1420; --surface:#162032; --ink:#E5EAF2; --muted:#9AA6B8; --line:#2A3649;
  --accent:#8FA3FF; --accent-soft:#1E2A4E; --accent-ink:#0E1420;
  --good:#52C48E; --good-soft:#123326; --bad:#F2806B; --bad-soft:#3A1C17; --warn:#E5B45C; --warn-soft:#382A12;
  --l-impacto:#8FA3FF; --l-resultado:#7186E6; --l-producto:#5163B5; --l-insumo:#384683;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E1420; --surface:#162032; --ink:#E5EAF2; --muted:#9AA6B8; --line:#2A3649;
  --accent:#8FA3FF; --accent-soft:#1E2A4E; --accent-ink:#0E1420;
  --good:#52C48E; --good-soft:#123326; --bad:#F2806B; --bad-soft:#3A1C17; --warn:#E5B45C; --warn-soft:#382A12;
  --l-impacto:#8FA3FF; --l-resultado:#7186E6; --l-producto:#5163B5; --l-insumo:#384683;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:auto}
.brand b{font-family:var(--f-display);font-stretch:112%;font-weight:800;font-size:19px;letter-spacing:-.01em}
.brand span{font-size:12px;color:var(--muted)}
@media (max-width:1400px){.brand span{display:none}}
.steps button{padding:6px 8px!important}
.steps{display:flex;gap:4px;flex-wrap:wrap}
.steps button{border:1px solid transparent;background:none;padding:6px 10px;border-radius:999px;font-size:13px;color:var(--muted);cursor:pointer;display:flex;gap:6px;align-items:center}
.steps button .n{font-family:var(--f-mono);font-size:11px;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line)}
.steps button[aria-current="step"]{color:var(--ink);border-color:var(--line);background:var(--paper)}
.steps button[aria-current="step"] .n{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.steps button.done .n{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.steps button:disabled{opacity:.45;cursor:not-allowed}
.facil{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer}
.facil[aria-pressed="true"]{background:var(--ink);color:var(--surface)}

main{padding-block:28px 64px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
h1{font-size:clamp(28px,4.2vw,44px);font-weight:800;font-stretch:108%;line-height:1.05;letter-spacing:-.02em}
h2{font-size:22px;font-weight:700;font-stretch:105%;letter-spacing:-.01em}
h3{font-size:16px;font-weight:700}
p{margin:0}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lede{font-size:17px;max-width:64ch;color:var(--ink)}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:10px 16px;border-radius:8px;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:24px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--paper);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.lvtag[data-l="impacto"]{background:var(--l-impacto);color:#fff;border-color:transparent}.lvtag[data-l="resultado"]{background:var(--l-resultado);color:#fff;border-color:transparent}
.tag.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.tag.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.tag.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* Caso */
.case{display:grid;grid-template-columns:1.25fr 1fr;gap:24px;margin-top:20px}
.case>*{min-width:0}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:18px}
.facts div{background:var(--surface);padding:12px 14px}
.facts b{display:block;font-family:var(--f-display);font-stretch:110%;font-size:24px;font-weight:800}
.facts span{font-size:12.5px;color:var(--muted)}
.components{display:grid;gap:10px;margin-top:18px}
.comp{border-left:3px solid var(--accent);padding:4px 0 4px 12px}
.objs{display:grid;gap:10px}
.obj{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:14px;cursor:pointer}
.obj input{margin-top:4px;accent-color:var(--accent)}
.obj:has(input:checked){border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset;background:var(--accent-soft)}
.obj b{display:block}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
input[type=text],textarea,select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 11px;font-size:15px;width:100%}
textarea{min-height:84px;resize:vertical}

/* Teoría de cambio */
.chain{display:grid;gap:10px;margin-top:20px}
.link{display:grid;grid-template-columns:1fr 200px;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.link>*{min-width:0}
.link.ok{border-color:var(--good)}
.link.ko{border-color:var(--bad)}
.link .fb{grid-column:1/-1;font-size:13px}
.assume{display:grid;gap:8px;margin-top:10px}

/* Tablero */
.board{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px;margin-top:20px;align-items:start}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.filters .fl{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);width:44px}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:12.5px;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.pool{display:grid;gap:8px}
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:6px 12px}
.mcard>*{min-width:0}
.mcard.on{border-color:var(--accent);background:var(--accent-soft)}
.mcard h3{font-size:15px}
.mcard .desc{grid-column:1/-1;font-size:13.5px;color:var(--muted)}
.mcard .meta{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}
.mcard details{grid-column:1/-1;font-size:13px}
.mcard summary{cursor:pointer;color:var(--accent);font-size:12.5px}
.add{border:1px solid var(--accent);background:var(--surface);color:var(--accent);border-radius:8px;padding:6px 10px;font-size:13px;font-weight:600;cursor:pointer;align-self:start;white-space:nowrap}
.mcard.on .add{background:var(--accent);color:var(--accent-ink)}
.add:disabled{opacity:.35;cursor:not-allowed}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 72px);display:flex;flex-direction:column;gap:14px}
.budget{display:flex;flex-direction:column;gap:6px}
.bar{height:10px;border-radius:999px;background:var(--paper);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .25s}
.bar.over i{background:var(--bad)}
.ladder{display:grid;gap:6px}
.rung{display:grid;grid-template-columns:94px 1fr;gap:10px;align-items:stretch}
.rung .lv{border-radius:8px;padding:8px 10px;font-family:var(--f-display);font-weight:700;font-stretch:105%;font-size:13px;color:#fff;display:flex;flex-direction:column;justify-content:center}
.rung .lv small{font-family:var(--f-body);font-weight:400;font-size:11px;opacity:.85}
.rung[data-l="impacto"] .lv{background:var(--l-impacto)}
.rung[data-l="resultado"] .lv{background:var(--l-resultado)}
.rung[data-l="producto"] .lv{background:var(--l-producto)}
.rung[data-l="insumo"] .lv{background:var(--l-insumo);color:var(--ink)}
.rung .slot{border:1px dashed var(--line);border-radius:8px;padding:6px;display:flex;flex-wrap:wrap;gap:6px;min-height:44px;align-content:flex-start;background:var(--surface)}
.chip{display:inline-flex;gap:6px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:4px 6px 4px 8px;font-size:12.5px}
.chip button{border:none;background:none;cursor:pointer;color:var(--muted);padding:0 2px;font-size:14px;line-height:1}
.empty{font-size:12px;color:var(--muted);padding:6px}
.lens{display:grid;gap:8px}
.note{font-size:13.5px;border-radius:8px;padding:9px 12px;display:flex;gap:8px;align-items:flex-start}
.note::before{content:"";flex:0 0 8px;height:8px;border-radius:50%;margin-top:6px;background:currentColor}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.bad{background:var(--bad-soft);color:var(--bad)}
.note.good{background:var(--good-soft);color:var(--good)}
.note.info{background:var(--accent-soft);color:var(--accent)}
.note span{color:var(--ink)}

/* Diagrama de teoría de cambio */
.toc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;margin-top:20px}
.toc-goal{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:14px}
.toc-row{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:22px;position:relative}
.toc-box{position:relative;border-radius:10px;padding:12px;background:var(--paper);border:1px solid var(--line);display:flex;flex-direction:column;gap:8px;min-width:0}
.toc-box h3{font-size:13px;font-stretch:108%;text-transform:uppercase;letter-spacing:.04em;color:#fff;margin:-12px -12px 0;padding:8px 12px;border-radius:9px 9px 0 0}
.toc-box[data-l="insumo"] h3{background:var(--l-insumo);color:var(--ink)}
.toc-box[data-l="actividad"] h3{background:var(--muted)}
.toc-box[data-l="producto"] h3{background:var(--l-producto)}
.toc-box[data-l="resultado"] h3{background:var(--l-resultado)}
.toc-box[data-l="impacto"] h3{background:var(--l-impacto)}
.toc-box p{font-size:13px;line-height:1.4}
.toc-box:not(:last-child)::after{content:"";position:absolute;right:-18px;top:50%;width:14px;height:14px;border-top:2px solid var(--muted);border-right:2px solid var(--muted);transform:translateY(-50%) rotate(45deg)}
.toc-miss{font-size:11.5px;color:var(--warn)}
.toc-metrics{display:flex;flex-direction:column;gap:4px;border-top:1px dashed var(--line);padding-top:8px}
.toc-metrics .chip{font-size:11.5px;background:var(--surface)}
.toc-assume{margin-top:16px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:22px}
.toc-assume div{grid-column:3/5;border:1.5px dashed var(--warn);border-radius:10px;padding:10px 12px;font-size:13px;background:var(--warn-soft);position:relative}
.toc-assume div::before{content:"";position:absolute;left:50%;top:-17px;height:16px;border-left:1.5px dashed var(--warn)}
.toc-assume b{color:var(--warn);display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;font-family:var(--f-mono);font-weight:500}
/* Recomendaciones */
.recs{display:grid;gap:10px}
.rec{border:1px solid var(--line);border-left:4px solid var(--line);border-radius:8px;padding:12px 14px;background:var(--surface)}
.rec.do{border-left-color:var(--bad)} .rec.tune{border-left-color:var(--warn)} .rec.keep{border-left-color:var(--good)} .rec.info{border-left-color:var(--accent)}
.rec b{display:block;margin-bottom:2px}
.rec p{font-size:13.5px;color:var(--muted)}
.rec .k{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.rec.do .k{color:var(--bad)} .rec.tune .k{color:var(--warn)} .rec.keep .k{color:var(--good)} .rec.info .k{color:var(--accent)}

/* Resultados */
.res{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:20px;margin-top:20px;align-items:start}
.score{display:flex;align-items:flex-end;gap:14px}
.score b{font-family:var(--f-display);font-stretch:118%;font-size:76px;line-height:.9;font-weight:800;letter-spacing:-.03em}
.score span{color:var(--muted);padding-bottom:8px}
.arch{font-family:var(--f-display);font-size:24px;font-weight:700;margin-top:8px}
.dims{display:grid;gap:10px;margin-top:16px}
.dim{display:grid;grid-template-columns:150px 1fr 58px;gap:10px;align-items:center;font-size:13.5px}
.dim .mono{text-align:right;font-size:12.5px}
.code{font-family:var(--f-mono);font-size:11.5px;word-break:break-all;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px;max-height:96px;overflow:auto}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:20px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.kpi b{font-family:var(--f-display);font-stretch:112%;font-size:34px;font-weight:800;line-height:1}
.kpi span{font-size:13px;color:var(--muted)}
.quotes{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-top:12px}
.quote{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;font-size:14.5px;min-width:0}
.scale{display:flex;gap:8px;margin-top:4px}
.sc{width:44px;height:40px;border:1px solid var(--line);background:var(--surface);border-radius:8px;font-weight:600;cursor:pointer;font-family:var(--f-mono)}
.sc.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.scale-l{display:flex;justify-content:space-between;max-width:252px;font-size:12px}
.tens{display:grid;gap:6px;margin-top:4px}
.tens .obj{padding:9px 12px;font-size:14px;color:var(--ink)}
.chart-panel{margin-top:20px}
.chart-sub{font-size:13.5px;margin-top:4px;margin-bottom:12px}
.mtx-wrap{overflow-x:auto}
.mtx{width:100%;min-width:480px;height:auto;display:block}
.res-mtx{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
.res .chart-panel{margin-top:0}
.mtx .qbad{fill:var(--bad-soft)} .mtx .qgood{fill:var(--good-soft)} .mtx .qn{fill:var(--paper)}
.mtx rect{stroke:var(--surface);stroke-width:3}
.mtx .ql{font:700 14px var(--f-display);fill:var(--ink)} .mtx .qs{font:12px var(--f-body);fill:var(--muted)}
.mtx .ax{font:11px var(--f-mono);fill:var(--muted)} .mtx .axt{font:12px var(--f-body);fill:var(--muted)}
.mtx .dot{fill:var(--accent);stroke:var(--surface);stroke-width:2} .mtx .dl{font:600 12px var(--f-body);fill:var(--ink)}
.heat{min-width:640px;font-size:13px}
.heat th{font-size:10.5px;white-space:normal;vertical-align:bottom}
.heat td{text-align:center} .heat td:first-child{text-align:left}
.hc{font-family:var(--f-mono);font-weight:600}
.hc.l0{background:var(--surface)} .hc.l1{background:var(--accent-soft)} .hc.l2{background:color-mix(in srgb,var(--accent) 45%,var(--surface));color:var(--ink)} .hc.l3{background:var(--accent);color:var(--accent-ink)}
.hc.l0{box-shadow:inset 0 0 0 1px var(--line)}
.heat tfoot td{font-family:var(--f-mono);font-size:12px;font-weight:600;border-top:2px solid var(--line)}
.hf.zero{color:var(--bad)} .hf.low{color:var(--warn)}
.tens-chart{display:grid;gap:12px}
.tr{display:grid;grid-template-columns:minmax(0,1fr) 28px;gap:4px 10px;align-items:center}
.tr .tl{grid-column:1/-1;font-size:13.5px}
.tr .tb{height:14px;background:var(--paper);border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.tr .tb i{display:block;height:100%;background:var(--accent);border-radius:999px}
.tr .tn{text-align:right;font-size:13px}
.tr .tavg{grid-column:1/-1;font-size:12px;color:var(--muted)}
/* Visión de producto */
.vision{display:flex;gap:18px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 22px;box-shadow:var(--shadow)}
.vision-ico{flex:0 0 52px;height:52px;border-radius:12px;background:var(--accent-soft);display:grid;place-items:center;font-size:28px;line-height:1}
.vision-body{min-width:0;flex:1}
.vision-q{font-family:var(--f-display);font-size:clamp(18px,2.2vw,23px);font-weight:700;font-stretch:104%;line-height:1.25;margin-top:6px;text-wrap:balance}
.vision-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:14px}
.vision-grid>div{min-width:0;border-top:2px solid var(--accent-soft);padding-top:8px}
.vision-grid span{font-size:12.5px;font-weight:600;color:var(--accent)}
.vision-grid p{font-size:13.5px;color:var(--muted);margin-top:3px}
.vision-grid>div:last-child{border-top-color:var(--warn)}
.vision-grid>div:last-child span{color:var(--warn)}
.vision-grid>div:last-child p{color:var(--ink);font-weight:600}
@media (max-width:760px){.vision{flex-direction:column}.vision-grid{grid-template-columns:1fr 1fr}}
@media (max-width:460px){.vision-grid{grid-template-columns:1fr}}
/* Carátula */
.laptop{max-width:900px;margin:26px auto 0}
.lp-screen{margin:0 3%;background:#141B2B;border-radius:16px 16px 4px 4px;padding:14px;box-shadow:0 10px 30px rgba(10,20,40,.18)}
.lp-win{background:#FFFFFF;color:#152033;border-radius:8px;overflow:hidden;min-height:330px;display:flex;flex-direction:column}
.lp-bar{display:flex;align-items:center;gap:6px;padding:8px 12px;background:#EEF1F6;border-bottom:1px solid #DDE2EA;font-size:12px;color:#5A6577}
.lp-bar i{width:10px;height:10px;border-radius:50%;background:#D3D8E1}

.lp-pane{padding:16px;display:flex;flex-direction:column;gap:10px}
.lp-pane+.lp-pane{border-left:1px solid #E3E7EE}

.msg.me{align-self:flex-end;background:#2340C4;color:#fff;border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:#F1F3F7;color:#152033;border-bottom-left-radius:4px;display:flex;flex-direction:column;gap:6px}
.caret{display:inline-block;width:2px;height:1em;background:currentColor;margin-left:2px;vertical-align:-2px;animation:blink 1s steps(1) infinite}
.typing{color:#5A6577;font-size:13px} .typing b{animation:blink 1.2s infinite} .typing b:nth-child(2){animation-delay:.2s} .typing b:nth-child(3){animation-delay:.4s}
.src{font-size:11.5px;color:#1D7A52;background:#E1F2EA;border-radius:6px;padding:3px 8px;align-self:flex-start}

.lp-task{font-size:13px;color:#5A6577;border:1px dashed #C9D0DC;border-radius:8px;padding:7px 10px}

.lp-base{height:16px;background:linear-gradient(#C8CEDA,#AEB6C5);border-radius:0 0 14px 14px}
.explain{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:22px}

@media (max-width:760px){.lp-body{grid-template-columns:1fr}.lp-pane+.lp-pane{border-left:none;border-top:1px solid #E3E7EE}.explain{grid-template-columns:1fr}}

/* Comparación */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}

<div class="toast" id="toast" hidden></div>

<script>
/* ---------- Datos del caso ---------- */
const OBJS = {
  A:{short:"Productividad temprana",q:"¿Llegan antes los ejecutivos nuevos a su meta comercial?",goal:"Reducir el tiempo hasta la productividad de los ejecutivos nuevos de 6 a 4 meses."},
  B:{short:"Calidad del asesoramiento",q:"¿Asesoran mejor a los clientes?",goal:"Reducir a la mitad los errores de asesoramiento sobre coberturas en el primer año."},
  C:{short:"Costo del onboarding",q:"¿Cuesta menos formar a cada ejecutivo?",goal:"Bajar 25 % el costo total de onboarding por ejecutivo, sin perder calidad."}
};
const LEVELS = [
  {id:"impacto",name:"Impacto",hint:"cambio institucional"},
  {id:"resultado",name:"Resultado",hint:"cambio en las personas"},
  {id:"producto",name:"Producto",hint:"lo que entrega y se usa"},
  {id:"insumo",name:"Insumo",hint:"lo que el sistema necesita"}
];
const LAYERS = {
  calidad:"Calidad de las respuestas", adopcion:"Uso", experiencia:"Experiencia y confianza",
  productividad:"Productividad y costo", resultados:"Resultados e impacto", riesgo:"Riesgo y supervisión"
};
const DATA = {disp:"Dato disponible", inst:"Hay que instrumentar", est:"Requiere un estudio", cual:"Relato (cualitativo)"};

const M = [
 {id:"fidelidad",n:"Respuestas correctas y con fuente",d:"Cada semana se revisan 50 respuestas: ¿lo que dice el asistente está en el documento que cita?",ly:"calidad",lv:"producto",c:12,data:"inst",fr:"Semanal",w:{A:1,B:3,C:0},lim:"Hay que acordar una rúbrica y que la apliquen personas, al menos al principio."},
 {id:"tareas",n:"Tareas completadas por el agente",d:"% de planes de onboarding que el agente arma y agenda.",ly:"calidad",lv:"producto",c:4,data:"disp",fr:"Diaria",w:{A:1,B:0,C:1},gameable:true,counter:["costo","intervencion"],lim:"Completar no es hacer bien: un plan inútil también cuenta como completado."},
 {id:"costo",n:"Costo por tarea bien hecha",d:"Gasto del agente y horas de mentor, dividido por las tareas que no hubo que rehacer.",ly:"productividad",lv:"producto",c:5,data:"inst",fr:"Mensual",w:{A:0,B:0,C:3},lim:"Hay que acordar qué cuenta como «bien hecha»; si no, vuelve a ser costo por tarea."},
 {id:"intervencion",n:"Casos que corrige un mentor",d:"% de respuestas o planes que un mentor tiene que corregir o rehacer.",ly:"riesgo",lv:"producto",c:4,data:"disp",fr:"Semanal",w:{A:1,B:2,C:2},lim:"Ambigua: que baje a cero también puede significar que nadie está revisando."},
 {id:"wau",n:"Usuarios activos por semana",d:"Ejecutivos que usaron el asistente al menos una vez en la semana.",ly:"adopcion",lv:"producto",c:3,data:"disp",fr:"Semanal",w:{A:1,B:1,C:1},lim:"Uso no es valor: dice que lo abren, no que les sirve."},
 {id:"consultas",n:"Total de consultas",d:"Cantidad de preguntas hechas al asistente.",ly:"adopcion",lv:"producto",c:2,data:"disp",fr:"Diaria",w:{A:0,B:0,C:0},vanity:true,counter:["fidelidad","errores"],lim:"Sube tanto si el asistente es útil como si responde mal y hay que volver a preguntar."},
 {id:"cursos",n:"Cursos completados",d:"Módulos de e-learning de producto terminados por los ejecutivos nuevos.",ly:"adopcion",lv:"producto",c:2,data:"disp",fr:"Mensual",w:{A:1,B:0,C:0},vanity:true,counter:["aprendizaje","errores"],lim:"Mide el paso por el contenido. Completar no es aprender."},
 {id:"csat",n:"Satisfacción con la respuesta",d:"Pulgar arriba o abajo después de cada respuesta.",ly:"experiencia",lv:"producto",c:3,data:"disp",fr:"Continua",w:{A:1,B:1,C:0},vanity:true,counter:["fidelidad","errores","confianza"],lim:"Las respuestas fluidas y seguras gustan aunque estén mal."},
 {id:"confianza",n:"Confianza calibrada",d:"Prueba con errores sembrados: ¿los ejecutivos verifican cuando corresponde?",ly:"experiencia",lv:"resultado",c:12,data:"est",fr:"Trimestral",w:{A:1,B:3,C:0},lim:"Mide comportamiento y no opinión, pero hay que diseñar la prueba."},
 {id:"ahorro",n:"Tiempo ahorrado (según los usuarios)",d:"Encuesta: «¿Cuántas horas por semana te ahorra el asistente?»",ly:"productividad",lv:"resultado",c:3,data:"disp",fr:"Mensual",w:{A:1,B:0,C:1},vanity:true,counter:["ttp","costo_onb","costo"],lim:"La percepción engaña: en un estudio de METR (2025), quienes usaban IA creían ir 20 % más rápido y fueron 19 % más lentos."},
 {id:"ttp",n:"Tiempo hasta la productividad",d:"Meses hasta alcanzar la meta comercial, comparado con las cohortes 2025 sin asistente.",ly:"resultados",lv:"resultado",c:15,data:"inst",fr:"Trimestral",w:{A:3,B:1,C:1},lim:"Otras cosas cambian a la vez (mercado, mentores): sin comparación, la atribución es débil."},
 {id:"errores",n:"Errores de asesoramiento en auditoría",d:"Muestra mensual de 100 llamadas auditadas por Calidad Comercial.",ly:"resultados",lv:"resultado",c:14,data:"inst",fr:"Mensual",w:{A:1,B:3,C:0},lim:"La auditoría ya existe, pero hay que ampliar la muestra y saber quién usa el asistente."},
 {id:"aprendizaje",n:"Desempeño sin el asistente",d:"Evaluación práctica a los 60 días, sin acceso al asistente: ¿aprenden o dependen?",ly:"resultados",lv:"resultado",c:10,data:"est",fr:"Por cohorte",w:{A:2,B:2,C:0},lim:"Es la «L» de MEL: mide aprendizaje, no uso."},
 {id:"ventas",n:"Pólizas bien vendidas por ejecutivo nuevo",d:"Pólizas vendidas en el primer año que siguen vigentes a los 6 meses, comparado con las cohortes 2025.",ly:"resultados",lv:"impacto",c:8,data:"inst",fr:"Trimestral",w:{A:3,B:2,C:1},lim:"Es el impacto que nombra la teoría de cambio. Depende también del mercado: necesita comparación."},
 {id:"nps",n:"Satisfacción de los clientes atendidos",d:"Encuesta breve a clientes después de hablar con un ejecutivo nuevo: ¿le resolvió lo que necesitaba?",ly:"resultados",lv:"impacto",c:5,data:"disp",fr:"Mensual",w:{A:1,B:2,C:0},lim:"Mide la experiencia del cliente, no si el asesoramiento fue correcto."},
 {id:"cobertura",n:"Cobertura de la base documental",d:"% de productos y regiones con documentación completa y actualizada en el asistente.",ly:"calidad",lv:"insumo",c:4,data:"inst",fr:"Mensual",w:{A:1,B:2,C:0},lim:"Si falta documentación de un producto, el asistente va a responder mal sobre ese producto."},
 {id:"reclamos",n:"Reclamos por mala información",d:"Reclamos de clientes clasificados como «información incorrecta».",ly:"resultados",lv:"impacto",c:6,data:"disp",fr:"Mensual",w:{A:0,B:3,C:0},lim:"Llega tarde (de 3 a 6 meses) y depende de que el cliente reclame."},
 {id:"rotacion",n:"Rotación temprana",d:"Ejecutivos que se van antes de los 6 meses.",ly:"resultados",lv:"impacto",c:4,data:"disp",fr:"Trimestral",w:{A:2,B:0,C:2},lim:"Tiene muchas causas; la IA es una entre varias."},
 {id:"costo_onb",n:"Costo total de onboarding",d:"Plataforma, asistente, horas de mentores y meses improductivos, por ejecutivo.",ly:"productividad",lv:"impacto",c:9,data:"inst",fr:"Trimestral",w:{A:1,B:0,C:3},lim:"Requiere acordar con Finanzas cómo se valoran las horas de mentor."},
 {id:"sesgo",n:"Brecha entre sucursales",d:"Calidad de respuesta y uso, mirados por sucursal, región y producto.",ly:"riesgo",lv:"producto",c:8,data:"inst",fr:"Mensual",w:{A:1,B:1,C:1},lim:"El promedio esconde: el asistente puede funcionar bien en la capital y mal en el interior."},
 {id:"msc",n:"Historias de cambio más significativo",d:"Cada mes, ejecutivos y mentores cuentan un cambio; un comité elige una historia y explica por qué.",ly:"resultados",lv:"resultado",c:6,data:"cual",fr:"Mensual",w:{A:1,B:1,C:1},lim:"No cuantifica; muestra qué cambia y qué valora la gente, incluido lo que nadie previó."},
 {id:"brinkerhoff",n:"Casos de éxito y de fracaso",d:"Entrevistas en las 2 sucursales que más mejoraron y en las 2 que menos.",ly:"resultados",lv:"impacto",c:9,data:"cual",fr:"Semestral",w:{A:2,B:2,C:2},lim:"No dice cuánto, dice por qué. Muy útil para decidir cómo escalar."}
];
const MI = Object.fromEntries(M.map(m=>[m.id,m]));
const BUDGET = 100, MAXM = 7;

const TDC = [
 {id:"t1",txt:"Una base de 2.300 documentos de producto, pólizas y normativa conectada al asistente.",ok:"insumo"},
 {id:"t2",txt:"Los ejecutivos nuevos consultan al asistente durante su primer trimestre y el agente les arma un plan de 30 días.",ok:"actividad"},
 {id:"t3",txt:"Respuestas con cita a la fuente y planes de onboarding completados.",ok:"producto"},
 {id:"t4",txt:"Los ejecutivos asesoran con precisión y autonomía antes que las cohortes anteriores.",ok:"resultado"},
 {id:"t5",txt:"Más pólizas bien vendidas, menos reclamos y menos rotación temprana en la red de sucursales.",ok:"impacto"}
];
const TDC_ORDER = ["t3","t5","t1","t4","t2"];
const TDC_LV = {insumo:"Insumos",actividad:"Actividades",producto:"Productos",resultado:"Resultados",impacto:"Impacto"};
const ASSUME = [
 {id:"a1",t:"Los ejecutivos tienen tiempo para usar el asistente.",s:1,fb:"Es un supuesto real, pero si falla lo verías enseguida en el uso."},
 {id:"a2",t:"Las respuestas son correctas y los ejecutivos verifican cuando corresponde.",s:2,fb:"Es el eslabón más frágil: si falla, los números de uso siguen subiendo mientras empeora el asesoramiento."},
 {id:"a3",t:"La plataforma está disponible el 99 % del tiempo.",s:0,fb:"Es una condición técnica que Tecnología ya monitorea; no es lo que pone en riesgo el cambio."},
 {id:"a4",t:"A los ejecutivos les gusta la tecnología.",s:0,fb:"El gusto no es el mecanismo del cambio. Se puede querer una herramienta que da respuestas equivocadas."}
];

/* ---------- Estado ---------- */
const KEY="brujula-lab-v2";
const fresh=()=>({saveId:null,saveState:null,savedAt:null,step:0,team:"",obj:null,tdc:{},tdcChecked:false,tdcReviewed:false,assume:null,sel:[],refl:{a:"",b:"",c:0,t:""},filter:"all",lvf:"all"});
let S=fresh(), view="game";
try{const raw=localStorage.getItem(KEY); if(raw){S=Object.assign(fresh(),JSON.parse(raw)); S.refl=Object.assign({a:"",b:"",c:0,t:""},S.refl);}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
if(!S.introDone&&S.step===0&&!S.obj) view="intro";

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $=sel=>document.querySelector(sel);
function toast(t){const el=$("#toast");el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2200)}

/* ---------- Cálculos ---------- */
const spent=()=>S.sel.reduce((a,id)=>a+MI[id].c,0);
const has=id=>S.sel.includes(id);
const q=id=>"«"+MI[id].n+"»";
const coreFor=o=>M.filter(m=>m.w[o]===3&&(m.lv==="resultado"||m.lv==="impacto"));

/* Avisos breves mientras arman el tablero */
function lens(){
  if(!S.sel.length) return [{t:"info",x:"Elijan métricas del catálogo. Acá van a ver qué ve y qué no ve su tablero."}];
  const out=[]; const lv=new Set(S.sel.map(id=>MI[id].lv)), ly=new Set(S.sel.map(id=>MI[id].ly));
  if(!lv.has("resultado")&&!lv.has("impacto")) out.push({t:"bad",x:"Todo su tablero mide lo que el sistema hace. Nada mide lo que cambia en las personas o en la institución."});
  else if(!S.sel.some(id=>MI[id].w[S.obj]>=2&&(MI[id].lv==="resultado"||MI[id].lv==="impacto"))) out.push({t:"bad",x:`Ninguna métrica responde directamente su pregunta: «${OBJS[S.obj].q}»`});
  S.sel.forEach(id=>{const m=MI[id]; if((m.vanity||m.gameable)&&!m.counter.some(has)) out.push({t:"warn",x:`${q(id)} puede mejorar mientras lo importante empeora.`});});
  if(!ly.has("calidad")) out.push({t:"warn",x:"Nada dice si las respuestas son correctas."});
  if(!ly.has("riesgo")) out.push({t:"warn",x:"Nada avisa si algo sale mal."});
  if(!out.length) out.push({t:"good",x:"Va bien: cubre la escalera y tiene contrapesos."});
  return out;
}
/* Recomendaciones finales: concretas, con qué agregar o sacar */
function recs(){
  const R=[]; const sel=S.sel.map(id=>MI[id]); const o=S.obj;
  const lv=new Set(sel.map(m=>m.lv)), ly=new Set(sel.map(m=>m.ly));
  const core=sel.filter(m=>m.w[o]===3&&(m.lv==="resultado"||m.lv==="impacto"));
  if(core.length) R.push({k:"keep",t:"Su tablero responde la pregunta del comité",x:`${core.map(m=>q(m.id)).join(" y ")} ${core.length>1?"miden":"mide"} directamente lo que se propusieron: «${OBJS[o].goal}»`});
  else R.push({k:"do",t:"Sumen una métrica que responda su pregunta",x:`Su pregunta es «${OBJS[o].q}». Las que la responden son ${coreFor(o).map(m=>q(m.id)).join(" o ")}. Sin una de ellas, el comité no va a poder decidir.`});
  sel.forEach(m=>{ if((m.vanity||m.gameable)&&!m.counter.some(has)) R.push({k:"tune",t:`${q(m.id)} necesita un contrapeso`,x:`${m.lim} Pónganla al lado de ${m.counter.map(q).slice(0,2).join(" o ")}${m.vanity?", o sáquenla y liberen "+m.c+" puntos":""}.`}); });
  if(!ly.has("calidad")) R.push({k:"do",t:"Midan si las respuestas son correctas",x:"Con IA, que la usen no dice que acierte. Sumen «Respuestas correctas y con fuente»: es el supuesto crítico de la teoría de cambio."});
  if(!ly.has("riesgo")) R.push({k:"do",t:"Sumen una señal de alerta",x:"«Casos que corrige un mentor» o «Brecha entre sucursales» les avisan cuando algo sale mal y para quién."});
  const ad=sel.filter(m=>m.ly==="adopcion"); if(ad.length>=2) R.push({k:"tune",t:"Tienen más de una métrica de uso",x:`${ad.map(m=>q(m.id)).join(", ")} cuentan casi la misma historia. Con una alcanza.`});
  if(!lv.has("impacto")&&lv.has("resultado")) R.push({k:"info",t:"No hay nada en el nivel de impacto",x:"Está bien si el horizonte es corto, pero díganlo: el comité va a preguntar por lo institucional."});
  const est=sel.filter(m=>m.data==="est"); if(est.length) R.push({k:"info",t:"Ojo con los tiempos",x:`${est.map(m=>q(m.id)).join(" y ")} requiere${est.length>1?"n":""} un estudio: la primera lectura llega en uno o dos meses.`});
  if(!sel.some(m=>m.data==="cual")) R.push({k:"info",t:"Falta el relato",x:"Los números dicen cuánto; las historias dicen por qué. Una sola fuente cualitativa («Historias de cambio» o «Casos de éxito y de fracaso») completa el cuadro."});
  else R.push({k:"keep",t:"Combinan número y relato",x:"Las historias les van a mostrar lo que ninguna métrica previó."});
  if(S.sel.length>=6) R.push({k:"info",t:`${S.sel.length} métricas`,x:"Antes de presentarlo, pregúntense de cada una: si se mueve, ¿qué decisión cambia? Si no hay respuesta, sobra."});
  if(S.assume!=="a2") R.push({k:"info",t:"Revisen el supuesto crítico",x:"El supuesto del que depende todo es que las respuestas sean correctas y que los ejecutivos verifiquen. ¿Hay alguna métrica que lo vigile?"});
  const order={do:0,tune:1,info:2,keep:3}; return R.sort((a,b)=>order[a.k]-order[b.k]);
}
function scores(){
  const sel=S.sel.map(id=>MI[id]); const o=S.obj||"A"; const cl=x=>Math.max(0,Math.min(1,x));
  const sumW=sel.reduce((a,m)=>a+m.w[o],0), hasCore=sel.some(m=>m.w[o]===3&&(m.lv==="resultado"||m.lv==="impacto"));
  const zero=sel.filter(m=>m.w[o]===0).length;
  const coh=Math.min(1,sumW/9)*0.6+(hasCore?0.4:0)-Math.max(0,zero-1)*0.1;
  const lvs=new Set(sel.map(m=>m.lv)); const esc_=["producto","resultado","impacto"].filter(l=>lvs.has(l)).length/3;
  const lys=new Set(sel.map(m=>m.ly)); let eq=lys.size/5; if(!lys.has("calidad")||!lys.has("riesgo")) eq=Math.min(eq,0.5);
  let con=1; sel.forEach(m=>{if((m.vanity||m.gameable)&&!m.counter.some(has)) con-=0.35});
  const n=sel.length; const par=n>=4&&n<=6?1:(n===3||n===7?0.7:0.3);
  const d=[{k:"Responde la pregunta",v:cl(coh),w:30},{k:"Escalera completa",v:cl(esc_),w:20},{k:"Mira todas las capas",v:cl(eq),w:20},{k:"Tiene contrapesos",v:cl(con),w:20},{k:"Pocas y buenas",v:cl(par),w:10}];
  return {d,total:Math.round(d.reduce((a,x)=>a+x.v*x.w,0))};
}
function archetype(sc){
  const sel=S.sel.map(id=>MI[id]); const lvs=new Set(sel.map(m=>m.lv)), lys=new Set(sel.map(m=>m.ly));
  if(sel.filter(m=>m.vanity).length>=2&&!lvs.has("resultado")&&!lvs.has("impacto")) return ["Tablero de vitrina","Muestra actividad y entusiasmo. No puede decir si algo cambió."];
  if(!lvs.has("resultado")&&!lvs.has("impacto")) return ["Tablero de operación","Sabe mucho de cómo funciona el sistema y poco de lo que cambia en las sucursales."];
  if(!lys.has("riesgo")&&!lys.has("calidad")) return ["Tablero optimista","Mide el valor que espera encontrar, pero no lo que puede salir mal."];
  if(sc.total>=80) return ["Tablero para decidir","Pocas métricas, bien elegidas, que responden la pregunta y avisan a tiempo."];
  if(sc.total>=60) return ["Tablero en buen camino","Cubre lo central; le faltan contrapesos o una capa."];
  return ["Tablero en construcción","Todavía mide más lo fácil que lo importante."];
}

async function storeTeam(p){

/* --- Gráfico 1: lo que creen vs. lo que miden --- */
function chartMatrix(T){
  const W=640,H=400,L=56,R=20,Tp=20,B=46, X=v=>L+v/100*(W-L-R), Y=v=>Tp+(5-v)/4*(H-Tp-B);
  const pts=T.filter(t=>t.c>=1);
  const seen={}; const dots=pts.map(t=>{const k=Math.round(t.s/4)+"-"+t.c; const n=seen[k]=(seen[k]||0)+1; return {t,x:X(t.s)+(n-1)*10,y:Y(t.c)-(n-1)*10}});
  const q=(x,y,w,h,label,sub,cls)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" class="${cls}"/><text x="${x+10}" y="${y+20}" class="ql">${label}</text><text x="${x+10}" y="${y+36}" class="qs">${sub}</text>`;
  const mx=X(60), my=Y(3);
  return `<svg viewBox="0 0 ${W} ${H}" class="mtx" role="img" aria-label="Matriz de confianza y puntaje por equipo">
    ${q(L,Tp,mx-L,my-Tp,"Sobreconfianza","seguros, pero el tablero no alcanza","qbad")}
    ${q(mx,Tp,W-R-mx,my-Tp,"Tablero para decidir","seguros y con razón","qgood")}
    ${q(L,my,mx-L,H-B-my,"En construcción","dudan, y con razón","qn")}
    ${q(mx,my,W-R-mx,H-B-my,"Dudan de más","el tablero es mejor de lo que creen","qn")}
    ${[0,20,40,60,80,100].map(v=>`<text x="${X(v)}" y="${H-B+18}" class="ax" text-anchor="middle">${v}</text>`).join("")}
    ${[1,2,3,4,5].map(v=>`<text x="${L-10}" y="${Y(v)+4}" class="ax" text-anchor="end">${v}</text>`).join("")}
    <text x="${(L+W-R)/2}" y="${H-6}" class="axt" text-anchor="middle">Puntaje del tablero (lo que miden)</text>
    <text x="14" y="${(Tp+H-B)/2}" class="axt" text-anchor="middle" transform="rotate(-90 14 ${(Tp+H-B)/2})">Confianza del equipo (lo que creen)</text>
    ${dots.map(d=>`<g><circle cx="${d.x}" cy="${d.y}" r="9" class="dot"/><text x="${d.x+13}" y="${d.y+4}" class="dl">${esc(d.t.t.replace(/^Ejemplo · /,""))}</text></g>`).join("")}
  </svg>`;
}
/* --- Gráfico 2: mapa de lo que miramos (equipo × capa) --- */
function chartHeat(T){
  const keys=Object.keys(LAYERS);
  const cnt=t=>keys.map(k=>t.m.filter(id=>MI[id].ly===k).length);
  const cover=keys.map((k,i)=>T.filter(t=>cnt(t)[i]>0).length);
  const cell=n=>`<td class="hc l${Math.min(n,3)}">${n||""}</td>`;
  return `<div class="tablewrap"><table class="heat">
    <thead><tr><th>Equipo</th>${keys.map(k=>`<th>${LAYERS[k]}</th>`).join("")}</tr></thead>
    <tbody>${T.map(t=>`<tr><td><b>${esc(t.t)}</b></td>${cnt(t).map(cell).join("")}</tr>`).join("")}</tbody>
    <tfoot><tr><td>Equipos que la miran</td>${cover.map(c=>`<td class="hf ${c===0?"zero":c<T.length/2?"low":""}">${c}/${T.length}</td>`).join("")}</tr></tfoot>
  </table></div>`;
}
/* --- Gráfico 3: qué pesó al elegir --- */
function chartTens(T){
  const rows=TENS.map(x=>{const g=T.filter(t=>t.tn===x.id); return {x,n:g.length,avg:g.length?Math.round(g.reduce((a,t)=>a+t.s,0)/g.length):null}}).sort((a,b)=>b.n-a.n);
  const max=Math.max(1,...rows.map(r=>r.n));
  return `<div class="tens-chart">${rows.map(r=>`<div class="tr"><span class="tl">${esc(r.x.t)}</span><div class="tb"><i style="width:${r.n/max*100}%"></i></div><span class="mono tn">${r.n}</span><span class="tavg">${r.avg==null?"":"puntaje prom. "+r.avg}</span></div>`).join("")}</div>`;
}

  <div class="res res-mtx">

      <div class="mtx-wrap">${chartMatrix(T)}</div></section>
    <div class="panel chart-panel"><h2>Qué podemos aprender</h2><div class="recs" style="margin-top:12px">${lessons.map(([k,x])=>`<div class="rec tune"><b>${esc(k)}</b><p>${esc(x)}</p></div>`).join("")}</div></div>

  <div class="res">
    <section class="panel chart-panel"><p class="eyebrow">Gráfico 3</p><h2>Qué pesó al elegir</h2>
      <p class="muted chart-sub">La tensión que cada equipo dijo que más le costó, con el puntaje promedio de esos tableros.</p>${chartTens(T)}</section>
    <div class="panel chart-panel"><h2>Lo que dijeron las salas</h2><div class="stack" style="margin-top:12px;gap:10px">${refl.length?refl.map(t=>`<article class="quote"><p class="eyebrow">${esc(t.t)} · ${esc(OBJS[t.o].short)}</p>${t.ra?`<p><span class="muted">Dejaron afuera:</span> ${esc(t.ra)}</p>`:""}${t.rb?`<p><span class="muted">Su «total de consultas»:</span> ${esc(t.rb)}</p>`:""}</article>`).join(""):`<p class="muted">Todavía no hay reflexiones escritas.</p>`}</div></div>

async function initLive(){
  if(SCRIPT_URL){
    RT.mode="sheet";
    loadSheet(); RT.poll=setInterval(()=>{ if(view==="class"&&!document.hidden) loadSheet(); },5000);
    return;
  }
  if(!window.claude||!claude.use){RT.mode="none"; return}
  const [db,room,user]=await Promise.all([claude.use("db"),claude.use("room"),claude.use("user")]);
  RT.db=db; RT.room=room; RT.mode=(db||room)?"claude":"none";
  try{RT.admin=user?await user.canEdit():false}catch(e){RT.admin=false}
  if(!db){ rerenderClass(); return }
  RT.timer=setTimeout(()=>{if(RT.status==="loading"){RT.status="stale"; rerenderClass();}},10000);
  db.collection("equipos").onSnapshot(snap=>{
    RT.teams=snap.docs.map(d=>clean(d.data())).filter(Boolean);
    if(!snap.metadata.fromCache){RT.status="live"; clearTimeout(RT.timer);}
    rerenderClass();
  },()=>{RT.status="stale"; clearTimeout(RT.timer); rerenderClass();});
  if(RT.admin&&room){ // quien facilita recoge lo que envían por presencia los equipos que no pueden escribir
    room.onPeers(ch=>{ (ch.peers||[]).forEach(async pr=>{ const x=clean(pr.presence&&pr.presence.brujula); if(!x) return;
      if(RT.seen[x.id]===x.ts) return; RT.seen[x.id]=x.ts; try{await db.doc("equipos/"+x.id).set(x)}catch(e){delete RT.seen[x.id]} }); });
  }
}

});

  if(t.dataset.tdc){S.tdc[t.dataset.tdc]=t.value; save(); render(); return}
  if(t.name==="assume"){S.assume=t.value; save(); render(); return}
  if(t.name==="tens"){S.refl.t=t.value; save(); const b=$("#saveTeam"); if(b) b.disabled=!canSave(); const h=$("#saveHint"); if(h) h.hidden=canSave(); return}
});
document.addEventListener("input",ev=>{
  const t=ev.target;
  if(t.id==="team"){S.team=t.value; save(); return}
  if(t.dataset.refl){S.refl[t.dataset.refl]=t.value; save(); return}
});
function selectCode(){const el=$("#code"); if(!el) return; const r=document.createRange(); r.selectNodeContents(el); const s=getSelection(); s.removeAllRanges(); s.addRange(r)}

render();
initLive();
</script>
